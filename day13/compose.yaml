services:

  frontend:
    build: ./frontend

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - frontend-net

    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null <http://127.0.0.1/> || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s


  backend:
    build: ./backend

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-tasksdb}
      DB_USER: ${POSTGRES_USER:-taskuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - frontend-net
      - backend-net

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s


  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasksdb}
      POSTGRES_USER: ${POSTGRES_USER:-taskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - backend-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


networks:
  frontend-net:
  backend-net:


volumes:
  postgres-data: