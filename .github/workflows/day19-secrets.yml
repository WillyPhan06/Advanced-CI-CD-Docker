
name: Day 19 - Secure Configuration Demo

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ====================================
  # Repository-level configuration
  # ====================================

  verify-repository-config:
    name: Verify repository configuration

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify repository secret and variable
        shell: bash

        env:
          DEMO_TOKEN: ${{ secrets.DAY19_DEMO_TOKEN }}
          APP_MODE: ${{ vars.APP_MODE }}

        run: |
          set +x

          if [[ -z "${DEMO_TOKEN:-}" ]]; then
            echo "::error::DAY19_DEMO_TOKEN is missing"
            exit 1
          fi

          if [[ "${APP_MODE:-}" != "ci-demo" ]]; then
            echo "::error::APP_MODE is missing or incorrect"
            exit 1
          fi

          echo "Repository secret is available."
          echo "Repository variable is configured."

          # Never print the secret value.


  # ====================================
  # Environment-level configuration
  # ====================================

  verify-staging-config:
    name: Verify staging configuration

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    environment:
      name: staging
      deployment: false

    permissions:
      contents: read

    steps:
      - name: Verify staging secret and variable
        shell: bash

        env:
          STAGING_TOKEN: ${{ secrets.STAGING_DEMO_TOKEN }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}

        run: |
          set +x

          if [[ -z "${STAGING_TOKEN:-}" ]]; then
            echo "::error::STAGING_DEMO_TOKEN is missing"
            exit 1
          fi

          if [[ "${DEPLOY_TARGET:-}" != "staging-demo" ]]; then
            echo "::error::DEPLOY_TARGET is missing or incorrect"
            exit 1
          fi

          echo "Staging secret is available."
          echo "Staging deployment configuration is present."

          # Never print the secret value.