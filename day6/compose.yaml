services:
  app:
    build: ./app
    ports:
      - "${APP_PORT}:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - app-net
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - app-net

networks:
  app-net:

volumes:
  redis-data: