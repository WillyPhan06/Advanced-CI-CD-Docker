
name: CI - Multi-stage Pipeline

on:
  push:

  pull_request:
    branches:
      - feature/day15-github-actions
      - main

permissions:
  contents: read

jobs:

  # ==================================
  # STAGE 1: VALIDATION
  # ==================================

  validate:
    name: Validate
    runs-on: ubuntu-24.04

    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret

    defaults:
      run:
        working-directory: day17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify project structure
        run: |
          test -f backend/app.py
          test -f backend/requirements.txt
          test -f backend/requirements-dev.txt
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          test -f compose.yaml

      - name: Check Python syntax
        run: |
          python -m compileall -q backend/

      - name: Validate Compose
        run: |
          docker compose config -q


  # ==================================
  # STAGE 2A: UNIT TESTS
  # ==================================

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: validate
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: day17/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: day17/backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          mkdir -p reports

          python -m pytest -v tests/test_api_unit.py \
            --junitxml="reports/unit-py${{ matrix.python-version }}.xml"

      - name: Upload unit-test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-py${{ matrix.python-version }}
          path: day17/backend/reports/unit-py${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 7


  # ==================================
  # STAGE 2B: INTEGRATION TESTS
  # ==================================

  integration-tests:
    name: Integration tests
    needs: validate
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: tasksdb
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: ci-only-not-a-secret

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U taskuser -d tasksdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: tasksdb
      DB_USER: taskuser
      DB_PASSWORD: ci-only-not-a-secret

    defaults:
      run:
        working-directory: day17/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: day17/backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          mkdir -p reports

          python -m pytest -v tests/test_api_integration.py \
            --junitxml=reports/integration.xml

      - name: Upload integration-test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: day17/backend/reports/integration.xml
          if-no-files-found: warn
          retention-days: 7

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==================================
  # STAGE 3A: FRONTEND BUILD
  # ==================================

  build-frontend:
    name: Build frontend image
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./day17/frontend
          file: ./day17/frontend/Dockerfile
          push: false
          tags: local/day17-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  # ==================================
  # STAGE 3B: BACKEND BUILD
  # ==================================

  build-backend:
    name: Build backend image
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./day17/backend
          file: ./day17/backend/Dockerfile
          push: false
          tags: local/day17-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


  # ==================================
  # STAGE 4: PUBLISH
  # ==================================

  publish-images:
    name: Publish images to GHCR

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs: [build-frontend, build-backend]
    runs-on: ubuntu-24.04

    # Only the publishing job receives write permission.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Define image names
        id: names
        shell: bash
        run: |
          REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          echo "frontend=ghcr.io/${REPO}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${REPO}-backend" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./day17/frontend
          file: ./day17/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.frontend }}:sha-${{ github.sha }}
            ${{ steps.names.outputs.frontend }}:main
            ${{ steps.names.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./day17/backend
          file: ./day17/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:sha-${{ github.sha }}
            ${{ steps.names.outputs.backend }}:main
            ${{ steps.names.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  collect-test-reports:
    name: Collect test reports

    needs:
      - validate
      - unit-tests
      - integration-tests

    if: ${{ always() && !cancelled() && needs.validate.result == 'success' }}

    runs-on: ubuntu-24.04

    steps:
      - name: Download test reports
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: downloaded-reports
          merge-multiple: true

      - name: Inspect downloaded reports
        run: |
          echo "Downloaded files:"
          find downloaded-reports -type f

          echo "Report directory:"
          ls -lh downloaded-reports

      - name: Generate combined test summary
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}

        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(
              Path("downloaded-reports").glob("*.xml")
          )

          if not reports:
              raise SystemExit("No JUnit reports were downloaded")

          totals = {
              "tests": 0,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
          }

          lines = [
              "# CI Test Summary",
              "",
              f"- Commit: `{os.environ['GITHUB_SHA']}`",
              f"- Unit-test job: **{os.environ['UNIT_RESULT']}**",
              f"- Integration-test job: **{os.environ['INTEGRATION_RESULT']}**",
              "",
              "| Report | Tests | Failures | Errors | Skipped |",
              "|---|---:|---:|---:|---:|",
          ]

          for report in reports:
              root = ET.parse(report).getroot()

              suites = list(root.iter("testsuite"))

              counts = {
                  key: sum(
                      int(suite.attrib.get(key, "0"))
                      for suite in suites
                  )
                  for key in totals
              }

              for key, value in counts.items():
                  totals[key] += value

              lines.append(
                  f"| {report.name} | "
                  f"{counts['tests']} | "
                  f"{counts['failures']} | "
                  f"{counts['errors']} | "
                  f"{counts['skipped']} |"
              )

          lines.extend([
              "",
              "## Combined totals",
              "",
              f"- Tests: {totals['tests']}",
              f"- Failures: {totals['failures']}",
              f"- Errors: {totals['errors']}",
              f"- Skipped: {totals['skipped']}",
          ])

          summary = "\n".join(lines) + "\n"

          Path("test-summary.md").write_text(summary)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as file:
              file.write(summary)

          print(summary)
          PY

      - name: Upload combined test summary
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-summary
          path: test-summary.md
          retention-days: 7
          if-no-files-found: error