
name: CI - Validate and Build Docker Images

on:
  push:

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # --------------------------------
  # Job 1: Validate the application
  # --------------------------------
  validate:
    name: Validate application
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    defaults:
      run:
        working-directory: day13

    env:
      POSTGRES_PASSWORD: ci-only-not-a-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify project structure
        run: |
          test -f backend/app.py
          test -f backend/requirements.txt
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f frontend/nginx.conf
          test -f compose.yaml

      - name: Check Python syntax
        run: |
          python -m compileall -q backend/

      - name: Validate Compose configuration
        run: |
          docker compose config -q

  # --------------------------------
  # Job 2: Build and publish images
  # --------------------------------
  build-images:
    name: Build Docker Images
    needs: validate
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Generate lowercase GHCR image names
      - name: Define image names
        id: image-names
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"

          echo "frontend=ghcr.io/${REPO}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${REPO}-backend" >> "$GITHUB_OUTPUT"

      # Generate frontend tags and labels
      - name: Generate frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-names.outputs.frontend }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Generate backend tags and labels
      - name: Generate backend metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-names.outputs.backend }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Authenticate only on pushes to main
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build frontend image
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./day13/frontend
          file: ./day13/frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Build backend image
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./day13/backend
          file: ./day13/backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend